apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketrush
  labels:
    app: ticketrush
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ticketrush
  template:
    metadata:
      labels:
        app: ticketrush
    spec:
      containers:
        - name: ticketrush
          image: ticketrush:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STATE_MODE
              value: redis
            - name: USE_MUTEX
              value: "true"
            - name: CPU_MODE
              value: WORKER
            - name: CPU_ITERATIONS
              value: "1000000"
            - name: MAX_WORKERS
              value: "2"
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: ticketrush
  labels:
    app: ticketrush
spec:
  type: NodePort
  selector:
    app: ticketrush
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
